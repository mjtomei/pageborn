<!doctype html><html><head><meta charset="utf-8"><title>Native text probe</title></head><body>
<h1>Native text scrolling probe</h1><pre id="log"></pre>
<script type="module">
import { waitForEvenAppBridge } from '@evenrealities/even_hub_sdk';
const log = (message, data) => { console.log('[native-probe]', message, JSON.stringify(data)); document.querySelector('#log').textContent += message + ' ' + JSON.stringify(data) + '\n'; };
const bridge = await waitForEvenAppBridge();
log('created', await bridge.createStartUpPageContainer({ containerTotalNum: 1, textObject: [{containerID:1, containerName:'body', xPosition:0, yPosition:0, width:576, height:288, paddingLength:4, isEventCapture:1, content:'Loading...'}] }));
bridge.onEvenHubEvent(event => log('input', event));
log('upgrade', await bridge.textContainerUpgrade({ containerID:1, containerName:'body', content:Array.from({length:25},(_,i)=>`Line ${String(i+1).padStart(2,'0')}: native firmware scroll.`).join('\n') }));
log('ready', {});
</script></body></html>
